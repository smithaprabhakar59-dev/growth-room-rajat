<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auracle Realtors · Growth Room</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400;1,6..96,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#F4F2EE}
.ar-card{transition:transform .35s ease, box-shadow .35s ease}
.ar-card:hover{transform:translateY(-4px);box-shadow:0 24px 48px -24px rgba(13,59,51,.45)}
.ar-zoom img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.ar-zoom:hover img{transform:scale(1.06)}
.ar-nav a:hover{background:rgba(246,246,243,.08)}
.ar-kicker{font-size:12px;letter-spacing:.3em;color:#8A6D42;font-weight:700}
.ar-h2{margin:6px 0 0;font-family:'Bodoni Moda',Georgia,serif;font-weight:400;font-size:clamp(32px,3.4vw,44px);line-height:1.05}
.ar-sub{margin:6px 0 0;color:#5E6B66;max-width:600px}
</style>

<script src="dc-lite.js"></script>
</head>
<body>
<template id="dc-template">
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: #F4F2EE; color: #14211D; font-family: Figtree, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.5">

  <aside style="flex: 1 1 232px; max-width: 264px; background: #0B2E28; color: #F6F6F3; padding: 34px 22px 28px; display: flex; flex-direction: column; gap: 40px; box-sizing: border-box; position: relative; overflow: hidden">
    <div style="position: absolute; inset: auto -40% -10% -40%; height: 340px; background: radial-gradient(closest-side, rgba(201,169,122,0.22), transparent); pointer-events: none"></div>
    <div style="display: flex; flex-direction: column; gap: 4px; position: relative">
      <svg aria-hidden="true" width="34" height="34" viewBox="0 0 40 40" fill="none" stroke="#C9A97A" stroke-width="1.4"><path d="M20 3 L35 37 H5 Z"/><path d="M12 25 H28"/><circle cx="20" cy="17" r="2.2" fill="#C9A97A" stroke="none"/></svg>
      <div style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: 0.18em; line-height: 1; margin-top: 10px">AURACLE</div>
      <div style="font-size: 11px; color: #C9A97A; letter-spacing: 0.42em; padding-left: 2px">REALTORS</div>
    </div>
    <nav class="ar-nav" aria-label="Dashboard sections" style="display: flex; flex-direction: column; gap: 2px; position: relative">
      <a href="#overview" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; background: rgba(246,246,243,0.10); color: #F6F6F3; text-decoration: none; font-weight: 600; box-shadow: inset 2px 0 0 #C9A97A">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>Overview</a>
      <a href="#radar" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #C5D2CD; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 3v3M21 12h-3"/></svg>Trend radar</a>
      <a href="#scripts" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #C5D2CD; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg>Scripts to approve</a>
      <a href="#areas" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #C5D2CD; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 21V9l5-3v15M9 21V4l6 3v14M15 21V11l5 2v8"/></svg>Area spotlight</a>
      <a href="#ideas" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #C5D2CD; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>Ideas board</a>
      <a href="#leads" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #C5D2CD; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16l-6 7v6l-4 2v-8z"/></svg>Leads and calendar</a>
      <a href="#brand" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #C5D2CD; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="9" r="4"/><circle cx="16" cy="9" r="4"/><circle cx="12" cy="16" r="4"/></svg>Brand kit</a>
      <a href="grid.html" style="display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 10px; color: #C5D2CD; text-decoration: none; font-weight: 500">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>Instagram grid</a>
    </nav>
    <div style="margin-top: auto; position: relative; display: flex; flex-direction: column; gap: 14px">
      <div style="border-radius: 14px; overflow: hidden; position: relative; height: 150px">
        <img src="img-living-room.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
        <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,46,40,0) 30%, rgba(11,46,40,0.92))"></div>
        <div style="position: absolute; left: 14px; right: 14px; bottom: 12px; font-size: 13px; line-height: 1.35">Next shoot day<br><span style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 19px">Sunday, 4 reels</span></div>
      </div>
      <div style="font-size: 13px; color: #C5D2CD; border-top: 1px solid rgba(246,246,243,0.14); padding-top: 14px">Growth partner<br><span style="color: #F6F6F3; font-weight: 600">Dr Smitha Prabhakar</span></div>
    </div>
  </aside>

  <main id="overview" style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 22px clamp(16px, 3vw, 40px) 72px; display: flex; flex-direction: column; gap: 56px">

    <section aria-label="Welcome" style="position: relative; border-radius: 28px; overflow: hidden; min-height: 480px; display: flex; color: #F6F6F3; background: #0B2E28">
      <img src="img-burj-sunrise-vertical.jpg" alt="Downtown Dubai at sunrise" style="position: absolute; right: 0; top: 0; height: 100%; width: 62%; object-fit: cover; object-position: 50% 30%">
      <div style="position: absolute; inset: 0; background: linear-gradient(90deg, #0B2E28 0%, #0B2E28 34%, rgba(11,46,40,0.55) 58%, rgba(11,46,40,0.05) 100%)"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(0deg, rgba(11,46,40,0.85), transparent 45%)"></div>
      <div style="position: relative; padding: clamp(26px, 4vw, 52px); display: flex; flex-direction: column; justify-content: space-between; gap: 36px; width: 100%; box-sizing: border-box">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap">
          <span style="font-size: 12px; letter-spacing: 0.3em; color: #C9A97A; font-weight: 600">THURSDAY · DUBAI</span>
          <span style="font-size: 12.5px; font-weight: 600; color: #F6F6F3; border: 1px solid rgba(246,246,243,0.4); border-radius: 999px; padding: 5px 12px; background: rgba(11,46,40,0.35)">Sample data for the demo</span>
        </div>
        <div style="max-width: 560px; display: flex; flex-direction: column; gap: 14px">
          <h1 style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-weight: 400; font-size: clamp(40px, 5.4vw, 72px); line-height: 1; letter-spacing: -0.015em">Good morning,<br><em style="color: #E4CFA6">Rajat.</em></h1>
          <p style="margin: 0; color: #D7E0DC; font-size: 17px; max-width: 440px">Day 1 of 90. Auracle Realtors starts from zero today, and every number on this page is yours to build.</p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px">
            <a href="#scripts" style="font: 600 14px Figtree, sans-serif; background: #C9A97A; color: #0B2E28; border-radius: 999px; padding: 13px 22px; text-decoration: none">Approve this week's scripts</a>
            <button type="button" style="font: 600 14px Figtree, sans-serif; background: transparent; color: #F6F6F3; border: 1px solid rgba(246,246,243,0.5); border-radius: 999px; padding: 13px 22px; cursor: pointer">Log an enquiry</button>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid rgba(246,246,243,0.22); padding-top: 18px; max-width: 760px">
          <div style="padding-right: 18px"><div style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1">1<span style="font-size: 18px; color: #C5D2CD"> / 90</span></div><div style="font-size: 13px; color: #C5D2CD; margin-top: 6px">Days into the journey</div><div style="height: 3px; background: rgba(246,246,243,0.18); margin-top: 10px; border-radius: 3px"><div style="width: 1.1%; min-width: 6px; height: 100%; background: #C9A97A; border-radius: 3px"></div></div></div>
          <div style="padding: 0 18px; border-left: 1px solid rgba(246,246,243,0.18)"><div style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1">0</div><div style="font-size: 13px; color: #C5D2CD; margin-top: 6px">Followers of [TARGET]</div></div>
          <div style="padding: 0 18px; border-left: 1px solid rgba(246,246,243,0.18)"><div style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1">0</div><div style="font-size: 13px; color: #C5D2CD; margin-top: 6px">Qualified enquiries</div></div>
          <div style="padding-left: 18px; border-left: 1px solid rgba(246,246,243,0.18)"><div style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 44px; line-height: 1">{{savedCount}}</div><div style="font-size: 13px; color: #C5D2CD; margin-top: 6px">Ideas saved</div></div>
        </div>
      </div>
    </section>

    <section aria-label="Your 90-day roadmap" style="display: flex; flex-direction: column; gap: 18px">
      <div>
        <div class="ar-kicker">FROM ZERO TO A WORKING ENGINE</div>
        <h2 class="ar-h2">Your 90-day roadmap</h2>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px">
        <sc-for list="{{phases}}" as="p" hint-placeholder-count="3">
          <div style="border-radius: 22px; padding: 22px; background: {{p.bg}}; color: {{p.ink}}; border: 1px solid {{p.line}}; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; letter-spacing: 0.24em; font-weight: 700; color: {{p.accent}}">{{p.when}}</span><span style="font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: {{p.pillBg}}; color: {{p.pillInk}}">{{p.status}}</span></div>
            <div style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 28px; line-height: 1.05">{{p.name}}</div>
            <div style="font-size: 14px; opacity: 0.85">{{p.what}}</div>
            <div style="font-size: 13px; border-top: 1px solid {{p.line}}; padding-top: 10px; margin-top: auto"><b>Goal:</b> {{p.goal}}</div>
          </div>
        </sc-for>
      </div>
    </section>

    <section aria-label="This week's focus" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
      <div style="background: #FFFFFF; border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #E5E1D8">
        <div class="ar-kicker">THIS WEEK'S ONE JOB</div>
        <p style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-size: 25px; line-height: 1.22">Publish the first three reels and set up the bio, link and highlights.</p>
        <p style="margin: 6px 0 0; color: #5E6B66; font-size: 14px">Everything else can wait. A finished profile and three reels make every later post work harder.</p>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #E5E1D8">
        <div style="display: flex; justify-content: space-between"><span class="ar-kicker">LAUNCH CHECKLIST</span><span style="font-size: 13px; font-weight: 700; color: #0B2E28">{{doneCount}} of 5</span></div>
        <sc-for list="{{checklist}}" as="c" hint-placeholder-count="5">
          <button type="button" onClick="{{c.toggle}}" style="all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 15px">
            <span style="width: 20px; height: 20px; border-radius: 50%; flex: none; border: 1.5px solid {{c.ring}}; background: {{c.fill}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 12px">{{c.tick}}</span>
            <span style="text-decoration: {{c.strike}}; color: {{c.ink}}">{{c.label}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section id="radar" aria-labelledby="radar-h" style="display: flex; flex-direction: column; gap: 20px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
        <div>
          <div class="ar-kicker">REFRESHED EVERY MORNING</div>
          <h2 id="radar-h" class="ar-h2">Trend radar</h2>
          <p class="ar-sub">Reels that beat their creator's usual views by three times or more. Save the ones you would film, and they move to your ideas board.</p>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <button type="button" onClick="{{f.pick}}" style="font: 600 13px Figtree, sans-serif; padding: 7px 14px; border-radius: 999px; cursor: pointer; background: {{f.bg}}; color: {{f.ink}}; border: 1px solid {{f.line}}">{{f.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(268px, 1fr)); gap: 18px">
        <sc-for list="{{trends}}" as="t" hint-placeholder-count="6">
          <article class="ar-card ar-zoom" style="background: #FFFFFF; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid {{t.border}}; box-shadow: {{t.glow}}">
            <div style="position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #0B2E28">
              <img src="{{t.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block; object-position: {{t.pos}}">
              <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(11,46,40,0.0) 40%, rgba(11,46,40,0.85))"></div>
              <span style="position: absolute; top: 12px; left: 12px; font-size: 12px; font-weight: 600; background: rgba(246,246,243,0.92); color: #0B2E28; border-radius: 999px; padding: 4px 10px">{{t.format}}</span>
              <svg aria-hidden="true" style="position: absolute; top: 12px; right: 12px" width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="rgba(11,46,40,0.55)"/><path d="M10 8v8l6-4z" fill="#F6F6F3"/></svg>
              <div style="position: absolute; left: 14px; bottom: 10px; color: #F6F6F3; display: flex; align-items: baseline; gap: 8px">
                <span style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 40px; line-height: 1">{{t.mult}}</span>
                <span style="font-size: 12.5px; color: #E4CFA6">above usual</span>
              </div>
            </div>
            <div style="padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1">
              <div style="font-size: 12.5px; color: #6B7772">{{t.meta}}</div>
              <p style="margin: 0; font-family: 'Bodoni Moda', Georgia, serif; font-size: 19px; line-height: 1.28">“{{t.hook}}”</p>
              <p style="margin: 0; color: #5E6B66; font-size: 14px">{{t.why}}</p>
              <button type="button" onClick="{{t.toggle}}" style="margin-top: auto; align-self: stretch; font: 600 14px Figtree, sans-serif; border-radius: 999px; padding: 11px 16px; cursor: pointer; border: 1px solid {{t.btnLine}}; background: {{t.btnBg}}; color: {{t.btnInk}}">{{t.label}}</button>
            </div>
          </article>
        </sc-for>
      </div>
    </section>

    <section id="scripts" aria-labelledby="scripts-h" style="display: flex; flex-direction: column; gap: 20px">
      <div>
        <div class="ar-kicker">YOUR SAY BEFORE ANYTHING IS FILMED</div>
        <h2 id="scripts-h" class="ar-h2">Scripts to approve</h2>
        <p class="ar-sub">Three scripts for this week. Approve, or ask for changes, and the shoot plan updates.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{scripts}}" as="s" hint-placeholder-count="3">
          <article style="background: #FFFFFF; border: 1px solid {{s.line}}; border-radius: 22px; overflow: hidden; display: flex; flex-wrap: wrap">
            <div style="flex: 0 0 200px; min-height: 200px; position: relative; background: #0B2E28">
              <img src="{{s.img}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
              <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(11,46,40,0.8))"></div>
              <span style="position: absolute; left: 14px; bottom: 12px; color: #F6F6F3; font-size: 12px; font-weight: 700; letter-spacing: 0.16em">{{s.len}}</span>
            </div>
            <div style="flex: 1 1 320px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
              <div style="display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap">
                <span style="font-family: 'Bodoni Moda', Georgia, serif; font-size: 24px; line-height: 1.1">{{s.title}}</span>
                <span style="font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: {{s.pillBg}}; color: {{s.pillInk}}">{{s.status}}</span>
              </div>
              <div style="display: grid; grid-template-columns: 74px 1fr; gap: 6px 12px; font-size: 14px">
                <span style="color: #8A6D42; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; padding-top: 2px">HOOK</span><span>{{s.hook}}</span>
                <span style="color: #8A6D42; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; padding-top: 2px">BODY</span><span style="color: #5E6B66">{{s.body}}</span>
                <span style="color: #8A6D42; font-weight: 700; font-size: 12px; letter-spacing: 0.12em; padding-top: 2px">ASK</span><span>{{s.cta}}</span>
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px">
                <button type="button" onClick="{{s.approve}}" style="font: 600 14px Figtree, sans-serif; border-radius: 999px; padding: 10px 18px; cursor: pointer; border: 0; background: #0B2E28; color: #F6F6F3">Approve</button>
                <button type="button" onClick="{{s.change}}" style="font: 600 14px Figtree, sans-serif; border-radius: 999px; padding: 10px 18px; cursor: pointer; border: 1px solid #CFC8BA; background: #FFFFFF; color: #0B2E28">Ask for changes</button>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
    </section>

    <section id="areas" aria-labelledby="areas-h" style="display: flex; flex-direction: column; gap: 20px">
      <div>
        <div class="ar-kicker">CONTENT PILLARS</div>
        <h2 id="areas-h" class="ar-h2">Area spotlight</h2>
        <p class="ar-sub">One neighbourhood a fortnight. Each gets a walk-through reel, a price carousel and an "is it for you" story.</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); grid-auto-rows: 210px; gap: 16px">
        <div class="ar-zoom" style="grid-row: span 2; grid-column: span 2; position: relative; border-radius: 24px; overflow: hidden; background: #0B2E28; min-width: 0">
          <img src="img-marina-night.jpg" alt="Dubai Marina at night" style="width: 100%; height: 100%; object-fit: cover; display: block">
          <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 35%, rgba(11,46,40,0.92))"></div>
          <div style="position: absolute; left: 24px; right: 24px; bottom: 22px; color: #F6F6F3; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 12px; letter-spacing: 0.26em; color: #E4CFA6; font-weight: 700">FORTNIGHT 1 · NOW</span>
            <span style="font-family: 'Bodoni Moda', Georgia, serif; font-size: clamp(30px, 3.4vw, 44px); line-height: 1">Dubai Marina</span>
            <span style="font-size: 14px; color: #D7E0DC; max-width: 460px">Waterfront towers, walkable, popular with renters. Prices and yields: [VERIFIED DATA REQUIRED]</span>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px"><span style="font-size: 12px; border: 1px solid rgba(246,246,243,0.45); border-radius: 999px; padding: 3px 10px">Walk-through reel</span><span style="font-size: 12px; border: 1px solid rgba(246,246,243,0.45); border-radius: 999px; padding: 3px 10px">Price carousel</span><span style="font-size: 12px; border: 1px solid rgba(246,246,243,0.45); border-radius: 999px; padding: 3px 10px">Is it for you story</span></div>
          </div>
        </div>
        <sc-for list="{{areas}}" as="a" hint-placeholder-count="4">
